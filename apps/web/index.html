<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fafafa">
  <meta name="description" content="字感 Type Feel：英文、中文、粤语沉浸式打字练习。拼音与粤拼提示、机械键盘音效，练习记录仅存本机。">
  <title>字感 · Type Feel</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>html,body{margin:0;background:#fafafa;color:#202124}html[data-theme=dark]{background:#18191b;color:#ececef}html[data-theme=dark] body{background:#18191b;color:#ececef}@media(prefers-color-scheme:dark){html:not([data-theme=light]),html:not([data-theme=light]) body{background:#18191b;color:#ececef}}</style>
  <script>
    try { var theme = localStorage.getItem('typefeel.theme'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme; } catch (_) {}
  </script>
  <!-- APP -->
</head>
<body>
  <main id="app" aria-label="Type Feel"></main>
  <noscript>请启用 JavaScript 开始练习。Enable JavaScript to start typing.</noscript>
</body>
</html>
